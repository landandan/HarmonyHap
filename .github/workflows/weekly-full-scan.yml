name: Weekly Full Scan

# Re-runs the complete discovery + processing pipeline from scratch once a week.
# Unlike the daily "Collect" run which relies on the on-disk intermediate state,
# this scan wipes the intermediate work dir first, so newly-published HAP projects
# (and projects that only recently added a buildable HAP structure) are guaranteed
# to be discovered and re-detected rather than skipped via stale work files.
#
# The GitHub API response cache (.cache) is preserved and restored (same key
# namespace as Collect): trees carry a 7-day TTL, so unchanged repos are not
# re-fetched — this is what keeps the scan inside the API rate budget.

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:

# Minimal permissions: only write contents when we commit generated data.
permissions:
  contents: write

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Compute cache key
        id: cache-key
        run: |
          HASH=$(git ls-tree HEAD config src | git hash-object --stdin)
          echo "key=github-cache-$HASH" >> $GITHUB_OUTPUT
          echo "restore=github-cache-" >> $GITHUB_OUTPUT

      - name: Cache GitHub API responses
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore }}

      - name: Install dependencies
        run: npm ci

      # Force a clean slate for discovery/work state so the scan cannot
      # silently skip repositories that changed since the last daily run.
      # The .cache (API responses) is intentionally kept.
      - name: Clean intermediate state
        run: rm -rf data/.work

      - name: Discover candidates (full)
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.HARMONY_TOKEN }}

      - name: Fetch metadata + trees
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.HARMONY_TOKEN }}

      - name: Detect HAP
        run: npm run hap

      - name: Enrich HAP-verified repos (README + languages)
        run: npm run enrich
        env:
          GITHUB_TOKEN: ${{ secrets.HARMONY_TOKEN }}

      - name: Detect platform
        run: npm run platform

      - name: Classify
        run: npm run classify

      - name: Score
        run: npm run score

      - name: Normalize
        run: npm run normalize

      # Generate must run before Validate: validateOutputs() checks the
      # data/statistics|categories|organizations.json + generated/* files
      # that `npm run generate` produces.
      - name: Generate outputs
        run: npm run generate

      - name: Validate
        run: npm run validate

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data generated README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): weekly full scan update"
          git push "https://x-access-token:${{ secrets.HARMONY_TOKEN }}@github.com/${{ github.repository }}.git" HEAD
