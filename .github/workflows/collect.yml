name: Collect

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Minimal permissions: only write contents when we commit generated data.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Stable cache key: hash of the config/ + src/ trees so unchanged code
      # reuses previously fetched API responses (trees, search, metadata).
      # Falls back to the latest matching `github-cache-` entry otherwise.
      - name: Compute cache key
        id: cache-key
        run: |
          HASH=$(git ls-tree HEAD config src | git hash-object --stdin)
          echo "key=github-cache-$HASH" >> $GITHUB_OUTPUT
          echo "restore=github-cache-" >> $GITHUB_OUTPUT

      - name: Cache GitHub API responses
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore }}

      - name: Install dependencies
        run: npm ci

      - name: Discover candidates
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.HARMONY_TOKEN }}

      - name: Fetch metadata + trees
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.HARMONY_TOKEN }}

      - name: Detect HAP
        run: npm run hap

      - name: Enrich HAP-verified repos (README + languages)
        run: npm run enrich
        env:
          GITHUB_TOKEN: ${{ secrets.HARMONY_TOKEN }}

      - name: Detect platform
        run: npm run platform

      - name: Classify
        run: npm run classify

      - name: Score
        run: npm run score

      - name: Normalize
        run: npm run normalize

      - name: Validate
        run: npm run validate

      - name: Generate outputs
        run: npm run generate

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data generated README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): update harmonyos repositories"
          git push "https://x-access-token:${{ secrets.HARMONY_TOKEN }}@github.com/${{ github.repository }}.git" HEAD
