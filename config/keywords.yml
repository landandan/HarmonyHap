# Keyword -> category mapping (config-driven classification).
# Each entry:
#   pattern:   case-insensitive substring or regex (regex when `regex: true`)
#   categories: one or more category ids to assign
#   source:    signal source used for evidence ("topic" | "readme" | "description" | "file" | "language" | "any")
#   weight:    relative strength (used for tie-break / evidence ordering)
# The classifier collects evidence and assigns categories. It NEVER hard-codes
# categories in TypeScript.
